# Render Blueprint — backend (FastAPI) as a Docker web service.
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo.
# Docs: https://render.com/docs/blueprint-spec
#
# "Render-only" setup: NO external services required. Uses an ephemeral SQLite
# file and an in-process Redis fallback so the app runs with zero extra signups.
# The ONLY thing you set by hand is ENCRYPTION_KEY (one Fernet key).
#
# Trade-off: data (accounts, trades) is ephemeral — it resets on every restart /
# redeploy. To persist data later, switch DATABASE_URL to Supabase and REDIS_URL
# to Upstash (see DEPLOYMENT.md).

services:
  - type: web
    name: ai-trading-backend
    runtime: docker
    repo: https://github.com/niclastaenzler/Trading
    branch: claude/ai-trading-platform-mvp-T280y
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      # Free instances spin down when idle, so the background scheduler can't run
      # reliably. Keep it OFF on free; set "1" on an always-on (paid) instance,
      # or trigger /api/trading/run-cycle from an external cron.
      - key: ENABLE_SCHEDULER
        value: "0"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: TRADINGVIEW_WEBHOOK_SECRET
        generateValue: true
      # Database — set by hand in the dashboard (sync:false so the blueprint
      # never overrides a manual value). For persistence use the Supabase
      # session-pooler URL with the +asyncpg driver, e.g.:
      #   postgresql+asyncpg://postgres.<ref>:<pw>@aws-0-<region>.pooler.supabase.com:5432/postgres
      # For a throwaway/no-DB run you may instead set: sqlite+aiosqlite:////tmp/app.db
      - key: DATABASE_URL
        sync: false
      # In-process Redis fallback (no external Redis needed).
      - key: REDIS_URL
        value: memory
      # Frontend origin allowed by CORS (GitHub Pages, origin only — no path).
      - key: CORS_ORIGINS
        value: https://niclastaenzler.github.io
      # --- set by hand in the Render dashboard ---
      # Fernet key: python -c "from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())"
      - key: ENCRYPTION_KEY
        sync: false
      # Invite code required to register (protects the public instance). Pick any
      # secret phrase; you enter it on the registration form.
      - key: REGISTRATION_INVITE_CODE
        sync: false
