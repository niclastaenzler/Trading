# Render Blueprint — backend (FastAPI) as a Docker web service.
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo.
# Docs: https://render.com/docs/blueprint-spec
#
# Database = Supabase (already provisioned); Redis = Upstash (free).
# Set the `sync: false` secrets in the Render dashboard after the first deploy.

services:
  - type: web
    name: ai-trading-backend
    runtime: docker
    repo: https://github.com/niclastaenzler/trading
    branch: claude/ai-trading-platform-mvp-T280y
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      # Free instances spin down when idle, so the background scheduler can't run
      # reliably. Keep it OFF on free; set "1" on an always-on (paid) instance,
      # or trigger /api/trading/run-cycle from an external cron.
      - key: ENABLE_SCHEDULER
        value: "0"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: TRADINGVIEW_WEBHOOK_SECRET
        generateValue: true
      # --- set these manually in the dashboard (sync:false) ---
      - key: ENCRYPTION_KEY        # Fernet key: python -c "from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())"
        sync: false
      - key: DATABASE_URL          # Supabase: postgresql+asyncpg://postgres:[PW]@db.cddgxnbyhkrhehilitzz.supabase.co:5432/postgres
        sync: false
      - key: REDIS_URL             # Upstash: rediss://default:[PW]@[host]:6379
        sync: false
      - key: CORS_ORIGINS          # e.g. https://niclastaenzler.github.io
        sync: false
