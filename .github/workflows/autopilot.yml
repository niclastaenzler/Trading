name: Autopilot (Trading-Cron)

# Treibt die Trading-Engine automatisch an, ohne dass jemand die Seite offen hat.
# Hintergrund: Auf Free-Hosting (Render) schläft der Server ein und der eingebaute
# Scheduler läuft dann nicht. Dieser Job ruft alle 5 Minuten den geschützten
# /api/trading/cron-Endpoint auf, der für jeden Owner mit aktivem Auto-Handel
# einen Trading-Zyklus ausführt. Die tatsächliche Trade-Frequenz begrenzt weiterhin
# der Compliance-Guard im Backend — ein häufiger Tick wird also NICHT zu HFT.
#
# Einrichtung (einmalig, in GitHub -> Settings -> Secrets and variables -> Actions):
#   BACKEND_URL  = z. B. https://dein-backend.onrender.com   (ohne abschließenden /)
#   CRON_SECRET  = derselbe Wert wie die Umgebungsvariable CRON_SECRET im Backend
#
# WICHTIG: Geplante Workflows laufen nur vom Default-Branch (main). Dieser Branch
# muss also nach main gemergt werden, damit der Zeitplan aktiv wird. Manuell
# testen kannst du jederzeit über "Run workflow".

on:
  schedule:
    - cron: "*/5 * * * *"   # alle 5 Minuten (kleinste von GitHub erlaubte Frequenz)
  workflow_dispatch: {}      # erlaubt manuelles Auslösen über die Actions-Oberfläche

# Verhindert, dass sich überlappende Läufe stapeln, falls einer länger dauert.
concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Trading-Zyklus anstoßen
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::BACKEND_URL oder CRON_SECRET fehlt. Bitte als Repository-Secrets anlegen."
            exit 1
          fi

          # Free-Hosting braucht u. U. ~50s zum Aufwachen -> bis zu 3 Versuche.
          for attempt in 1 2 3; do
            echo "Versuch $attempt: rufe Cron-Endpoint auf …"
            code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" --max-time 90 \
              -X POST "$BACKEND_URL/api/trading/cron?secret=$CRON_SECRET" || echo "000")
            echo "HTTP $code"
            cat /tmp/resp.txt || true
            echo ""
            if [ "$code" = "200" ]; then
              echo "Zyklus ausgeführt ✓"
              exit 0
            fi
            echo "Noch nicht bereit (Server wacht evtl. auf) — warte 30s …"
            sleep 30
          done

          echo "::error::Cron-Endpoint hat nach 3 Versuchen nicht mit 200 geantwortet."
          exit 1
