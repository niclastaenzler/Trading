name: Deploy frontend to GitHub Pages

# Builds the Next.js app as a static export and publishes it to GitHub Pages.
# Requirements (one-time):
#   * Repo Settings -> Pages -> Source = "GitHub Actions"
#   * Repo Settings -> Secrets and variables -> Actions -> Variables:
#       NEXT_PUBLIC_API_URL = https://<your-render-service>.onrender.com   (required)
#       PAGES_BASE_PATH     = /trading   (optional; defaults to /trading)

on:
  push:
    branches: [claude/ai-trading-platform-mvp-T280y, main]
    paths: ["frontend/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - name: Build static export
        env:
          BUILD_TARGET: static
          PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH || '/trading' }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          npm run build
          touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
